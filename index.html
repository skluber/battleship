<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>

        <header>
            <h1>Battleship</h1>
            <p id="game-status">Your turn</p>
        </header>

        <section aria-label="Game boards">
            <div class="board-container">
                <h2>Your Fleet</h2>
                <div id="player-board"></div>
            </div>

            <div class="board-container">
                <h2>Enemy Fleet</h2>
                <div id="enemy-board"></div>
            </div>
        </section>

    </main>

    <footer>
        <p>Battleship · Built with JavaScript</p>
    </footer>

</body>
</html>
